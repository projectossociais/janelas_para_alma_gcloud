# Serve o build estático do frontend (SPA — qualquer rota desconhecida cai
# em index.html, o React Router é que decide) e reencaminha /api/ para o
# serviço da API. Usado dentro do container do frontend (ver
# infra/docker/frontend.Dockerfile) e localmente via docker-compose.
#
# Em produção no Cloud Run, cada serviço tem o seu próprio domínio/URL — este
# proxy de /api/ interessa sobretudo ao ambiente local (docker-compose), onde
# simplifica CORS ao fazer tudo parecer vir da mesma origem.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }

    # Ficheiros com hash no nome (Vite) podem ser cacheados de forma agressiva.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
