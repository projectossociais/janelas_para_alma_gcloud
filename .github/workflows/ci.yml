name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jpa
          POSTGRES_PASSWORD: jpa
          POSTGRES_DB: jpa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jpa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://jpa:jpa@localhost:5432/jpa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -v
      # As migrações são escritas à mão — este passo é a única vez que correm
      # contra um Postgres real antes de produção. Se não aplicarem limpo,
      # falha aqui, não no `05-migrate.sh` do deploy.
      - name: Migrações Alembic contra Postgres real
        run: python -m alembic upgrade head
      # Informativo: avisa se orm_models.py divergiu das migrações sem falhar
      # o CI (o autogenerate tem falsos positivos conhecidos com defaults/enums).
      - name: Alembic — detecção de drift (informativo)
        continue-on-error: true
        run: python -m alembic check

  imagens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Constrói as imagens que vão para o Cloud Run. Sem isto, uma regressão
      # num Dockerfile ou no default.conf.template só aparece no deploy — já
      # aconteceu (COPY de infra/nginx/nginx.conf depois de o ficheiro sair).
      - name: Build da imagem da API
        run: docker build -f infra/docker/api.Dockerfile -t jpa-api:ci .
      - name: Build da imagem do frontend
        run: docker build -f infra/docker/frontend.Dockerfile -t jpa-frontend:ci .
      # Renderiza o template (envsubst da imagem oficial) e valida com nginx -t.
      - name: NGINX — config renderiza e passa no nginx -t
        run: docker run --rm -e API_URL=http://api.exemplo:8000 jpa-frontend:ci nginx -t
