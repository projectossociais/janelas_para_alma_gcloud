name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jpa
          POSTGRES_PASSWORD: jpa
          POSTGRES_DB: jpa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jpa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://jpa:jpa@localhost:5432/jpa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -v
      # As migrações são escritas à mão — este passo é a única vez que correm
      # contra um Postgres real antes de produção. Se não aplicarem limpo,
      # falha aqui, não no `05-migrate.sh` do deploy.
      - name: Migrações Alembic contra Postgres real
        run: python -m alembic upgrade head
      # Informativo: avisa se orm_models.py divergiu das migrações sem falhar
      # o CI (o autogenerate tem falsos positivos conhecidos com defaults/enums).
      - name: Alembic — detecção de drift (informativo)
        continue-on-error: true
        run: python -m alembic check

  imagem-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Constrói a imagem que vai para o Cloud Run. Sem isto, uma regressão no
      # Dockerfile só aparece no deploy. O frontend não tem imagem própria —
      # é servido pelo Vercel (deploy automático dele, fora deste CI); o
      # `npm run build` do job `frontend` acima já é o portão de qualidade
      # desse lado.
      - name: Build da imagem da API
        run: docker build -f infra/docker/api.Dockerfile -t jpa-api:ci .

  # Deploy automático da API a cada push/merge em `main` -- decisão do dono
  # do projecto (2026-09-15, ver CLAUDE.md secção 10) para o Lukeny (ou
  # quem for) conseguir levar uma alteração ao backend a produção só com um
  # push, tal como o frontend já faz no Vercel. Só corre depois de `api` e
  # `imagem-api` passarem -- nunca em PRs, nunca em forks (o `if` abaixo e a
  # condição do provider OIDC em 06-ci-cd-setup.sh garantem isso em duas
  # camadas). Sem segredos de longa duração: autentica por Workload Identity
  # Federation (token OIDC do próprio GitHub, válido minutos, nunca
  # guardado) -- ver infra/gcloud/06-ci-cd-setup.sh para o porquê.
  #
  # Fica sem efeito (passos gcloud falham) até o DEP-02 estar resolvido
  # (projecto GCloud criado) e o 06-ci-cd-setup.sh ter corrido uma vez --
  # ver docs/tarefas.csv.
  deploy-api:
    needs: [api, imagem-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # As mesmas variáveis que 00-config.sh define localmente (ver
      # infra/gcloud/00-config.example.sh) -- aqui vindas de Variables do
      # repositório (nenhuma é secreta: nomes de projecto, região, emails de
      # service account) em vez de um ficheiro local. Os dois caminhos
      # correm exactamente os mesmos scripts a seguir, de propósito.
      - name: Preparar variáveis de configuração
        run: |
          {
            echo "PROJECT_ID=${{ vars.GCP_PROJECT_ID }}"
            echo "REGION=${{ vars.GCP_REGION }}"
            echo "AR_REPO=${{ vars.GCP_AR_REPO }}"
            echo "SQL_INSTANCE=${{ vars.GCP_SQL_INSTANCE }}"
            echo "SQL_CONNECTION_NAME=${{ vars.GCP_SQL_CONNECTION_NAME }}"
            echo "API_SERVICE=${{ vars.GCP_API_SERVICE }}"
            echo "FRONTEND_DOMAIN=${{ vars.GCP_FRONTEND_DOMAIN }}"
            echo "AR_HOST=${{ vars.GCP_REGION }}-docker.pkg.dev"
            echo "IMAGE_BASE=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}"
            # Nenhum destes é secreto (email de remetente, ID de cliente
            # OAuth, domínio do frontend) -- sem os passar aqui, 04-deploy.sh
            # não os tinha de lado nenhum no caminho automático (só existiam
            # em 00-config.sh, que não existe neste runner), e cada deploy
            # automático ia silenciosamente apagá-los do serviço em produção
            # (--set-env-vars substitui, não soma).
            echo "EMAIL_REMETENTE=${{ vars.GCP_EMAIL_REMETENTE }}"
            echo "GOOGLE_CLIENT_ID=${{ vars.GCP_GOOGLE_CLIENT_ID }}"
            echo "FRONTEND_BASE_URL=https://${{ vars.GCP_FRONTEND_DOMAIN }}"
            # Idem para o R2: endpoint/bucket/URL pública não são secretos
            # (as chaves de acesso é que vivem só no Secret Manager, nunca
            # aqui) -- sem isto, 04-deploy.sh nunca ligava R2_ENDPOINT_URL/
            # R2_BUCKET no caminho automático (só via 00-config.sh local),
            # e o upload de avatar/publicações ficava sem storage em
            # qualquer deploy feito só pelo CI.
            echo "R2_ENDPOINT_URL=${{ vars.GCP_R2_ENDPOINT_URL }}"
            echo "R2_BUCKET=${{ vars.GCP_R2_BUCKET }}"
            echo "R2_PUBLIC_BASE_URL=${{ vars.GCP_R2_PUBLIC_BASE_URL }}"
          } >> "$GITHUB_ENV"

      # 05 ANTES do 04, sempre -- uma migração tem de aplicar-se contra o
      # esquema antigo antes do código novo começar a servir pedidos com
      # ele. `$CI` já vem definido pelo GitHub Actions, por isso o script
      # sabe que não deve parar a pedir confirmação (ver a nota no próprio
      # ficheiro sobre a rede de segurança que fica no lugar dessa pausa).
      - name: Migrar o esquema (com backup automático antes)
        run: ./infra/gcloud/05-migrate.sh

      - name: Deploy da API no Cloud Run
        run: ./infra/gcloud/04-deploy.sh
