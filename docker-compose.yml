# Ambiente de desenvolvimento local. Em produção, cada serviço (db via Cloud
# SQL, api e frontend via Cloud Run) é implantado separadamente — este
# ficheiro nunca é usado em produção, só espelha a topologia para dev.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jpa
      POSTGRES_PASSWORD: jpa
      POSTGRES_DB: jpa
    ports:
      - "5432:5432"
    volumes:
      - jpa_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jpa"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://jpa:jpa@db:5432/jpa
      JWT_SECRET_KEY: chave-de-desenvolvimento-nao-usar-em-producao
    volumes:
      - ./api/app:/app/app
      - ./api/alembic:/app/alembic
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      # Lida em run-time pelo envsubst da imagem NGINX (default.conf.template):
      # alvo do proxy /api/. Aqui é o nome do serviço na rede do compose; em
      # produção (Cloud Run) é o URL público da API, definido no deploy.
      # O browser fala com /api/ na mesma origem — não há VITE_API_URL a baked.
      API_URL: http://api:8000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  jpa_db_data:
