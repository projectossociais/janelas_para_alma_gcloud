# Ambiente de desenvolvimento local. Em produção, o `db` vive no Cloud SQL e a
# `api` num container próprio no Cloud Run — este ficheiro nunca é usado em
# produção, só espelha essa topologia para dev. O frontend não tem serviço
# aqui: em produção é o Vercel que o serve (ver CLAUDE.md §0/§2), e em dev
# usa-se sempre `npm run dev` dentro de `frontend/` (hot reload real; o proxy
# do Vite já reencaminha /api/* tal como o Vercel faz em produção).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jpa
      POSTGRES_PASSWORD: jpa
      POSTGRES_DB: jpa
    ports:
      - "5432:5432"
    volumes:
      - jpa_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jpa"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://jpa:jpa@db:5432/jpa
      JWT_SECRET_KEY: chave-de-desenvolvimento-nao-usar-em-producao
    volumes:
      - ./api/app:/app/app
      - ./api/alembic:/app/alembic
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  jpa_db_data:
