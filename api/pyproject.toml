[project]
name = "janelasparaalma-api"
version = "0.1.0"
description = "API própria da Janelas Para a Alma — FastAPI, camadas routers/services/repositories/schemas/core. Ver CLAUDE.md."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "passlib[argon2]>=1.7.4",
    "pyjwt>=2.9",
    "boto3>=1.35",
    "httpx>=0.27",
    "google-auth>=2.35",
    # google.auth.transport.requests (usado para verificar o id_token do
    # Google) precisa disto à parte -- não é dependência obrigatória do
    # google-auth. Só passou despercebido em dev porque outra biblioteca já
    # o tinha instalado por acaso; o CI, num ambiente limpo, apanhou logo.
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` como default de argumento é o padrão idiomático do FastAPI,
# não o bug que B008 normalmente apanha (uma chamada mutável avaliada uma
# única vez). Ver https://fastapi.tiangolo.com/tutorial/dependencies/
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
