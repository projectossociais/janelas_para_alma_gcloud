<!doctype html>
<html lang="pt-AO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sem ligação | Janelas Para a Alma</title>
    <!-- Mostrada pela app nativa (capacitor.config.ts, errorPath) quando o site
         não carrega. Tudo inline: não pode depender da rede. Cores de `marca.*`. -->
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        background: #001F54;
        color: #FAFDEF;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        box-sizing: border-box; text-align: center;
      }
      main { max-width: 22rem; }
      h1 { font-size: 1.4rem; margin: 0 0 .75rem; }
      p { line-height: 1.5; margin: 0 0 1.5rem; color: #9BCDF8; }
      button {
        background: #E0C050; color: #001F54; border: 0; border-radius: 999px;
        font-size: 1rem; font-weight: 600; padding: .85rem 2rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem ligação à internet</h1>
      <p>A Janelas Para a Alma precisa de internet para abrir. Verifique os dados móveis ou o Wi-Fi e tente outra vez.</p>
      <button type="button" onclick="location.href='https://www.janelasparaalma.com/'">Tentar outra vez</button>
    </main>
  </body>
</html>
